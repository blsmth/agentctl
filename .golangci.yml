version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - forbidigo
  settings:
    forbidigo:
      forbid:
        - pattern: ^os\.Exit$
          msg: use cliout.Exit so stdout buffered by cliout.Plain is flushed
    errcheck:
      # Don't flag unchecked errors on these functions — they're almost always
      # intentional (deferred closes, fmt to stdout, os.Remove in cleanup).
      exclude-functions:
        - "fmt.Fprint"
        - "fmt.Fprintf"
        - "fmt.Fprintln"
        - "fmt.Printf"
        - "fmt.Sscanf"
        - "(*os.File).Close"
        - "io.WriteString"
        - "(*os.File).WriteString"
        - "os.Remove"
        - "os.Chmod"
        - "os.MkdirAll"
        - "os.Unsetenv"
        - "(*net/http.Response).Body.Close"
        - "(*bufio.Writer).Flush"
    staticcheck:
      checks:
        - "all"
        - "-QF*"  # disable quickfix suggestions — they're style not correctness
        - "-ST*"  # disable style suggestions
  exclusions:
    rules:
      # forbidigo only applies to internal/cmd (CLI command bodies), not tests:
      # exclude every other path. (path-except did not work with this linter.)
      - path: ^([^/]+\.go|internal/([^c]|c[^m]|cm[^d]|cmd[^/]).*|cmd/.*)$
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - forbidigo
