<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Channel Window Icon — agentctl -->
  <!-- Dark background -->
  <rect width="512" height="512" fill="#08090c"/>

  <!-- Window frame -->
  <rect x="32" y="32" width="448" height="448" fill="none" stroke="#7C6AEF" stroke-width="4"/>

  <!-- Title bar -->
  <rect x="32" y="32" width="448" height="56" fill="#7C6AEF" fill-opacity="0.12"/>
  <line x1="32" y1="88" x2="480" y2="88" stroke="#7C6AEF" stroke-width="1.5" opacity="0.3"/>
  <text x="56" y="70" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="28" font-weight="700" fill="#A78BFA">#agentctl</text>
  <text x="446" y="70" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="28" fill="#555">×</text>

  <!-- Message area -->
  <!-- Agent 1: idle/done (green) -->
  <text x="56" y="136" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" fill="#7C6AEF">&lt;</text>
  <text x="72" y="136" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" font-weight="700" fill="#34D399">go-eng</text>
  <text x="216" y="136" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" fill="#7C6AEF">&gt;</text>
  <text x="244" y="136" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" fill="#888">PR #138 ready for review</text>

  <!-- Agent 2: working (amber) -->
  <text x="56" y="184" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" fill="#7C6AEF">&lt;</text>
  <text x="72" y="184" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" font-weight="700" fill="#FBBF24">infra</text>
  <text x="192" y="184" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" fill="#7C6AEF">&gt;</text>
  <text x="220" y="184" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" fill="#888">writing tests...</text>

  <!-- Agent 3: blocked (red) -->
  <text x="56" y="232" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" fill="#7C6AEF">&lt;</text>
  <text x="72" y="232" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" font-weight="700" fill="#F87171">platform</text>
  <text x="264" y="232" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" fill="#7C6AEF">&gt;</text>
  <text x="292" y="232" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" fill="#888">needs approval</text>

  <!-- Agent 4: working (amber) -->
  <text x="56" y="280" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" fill="#7C6AEF">&lt;</text>
  <text x="72" y="280" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" font-weight="700" fill="#FBBF24">docs</text>
  <text x="168" y="280" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" fill="#7C6AEF">&gt;</text>
  <text x="196" y="280" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" fill="#888">updating README</text>

  <!-- Divider line -->
  <line x1="32" y1="320" x2="480" y2="320" stroke="#7C6AEF" stroke-width="1" opacity="0.25"/>

  <!-- Input prompt -->
  <text x="56" y="362" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="26" font-weight="700" fill="#7C6AEF">&gt;</text>
  <text x="84" y="362" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="24" fill="#666">dispatch --issue 42</text>
  <!-- Cursor -->
  <rect x="372" y="342" width="3" height="26" fill="#A78BFA" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.7;0;0" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Status bar -->
  <rect x="32" y="424" width="448" height="56" fill="#7C6AEF" fill-opacity="0.08"/>
  <line x1="32" y1="424" x2="480" y2="424" stroke="#7C6AEF" stroke-width="1.5" opacity="0.2"/>
  <text x="56" y="460" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="22" fill="#A78BFA">[W:2 I:1 B:1]</text>
  <text x="300" y="460" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Courier New', monospace" font-size="22" fill="#555">4 agents</text>
</svg>
